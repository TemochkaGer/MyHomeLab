server {
    listen 80;
    listen [::]:80;

    server_name 192.168.3.15;

    root /var/www/html;
    index *.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass web-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

        try_files $uri =404;
    }
}